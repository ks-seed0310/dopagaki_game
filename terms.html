    まず結論から言うね☑まとめると、「自己責任でプレイしてね！」っていう意味だよ！

    Dopagaki Game Studio(以下、ドパゲー)のルール

    1. 読まなくても遊んだ時点で読んだということにします。
    2. このルールは開発者が勝手に変えるかもです。
    3. 「Wi-Fiが遅すぎてゲームが遅い」や「カクカクする」の文句は聞きません。自分でなんとかしろ。
    4. ズル、不正、チート禁止。
    5. 勝手にこのゲームスタジオは終わるかもしれないけど知りません。
    6. ドパゲーのゲームは楽しんで遊ぼう！

    終わり。
