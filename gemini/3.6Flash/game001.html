<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【極限】ドパガキ専用ドパドパBrainrotシミュレーター【超完全版】</title>
    <style>
        :root {
            --bg-color: #050505;
            --main-color: #ff0055;
            --sub-color: #00ffff;
            --gold-color: #ffe600;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Impact', 'Arial Black', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: #fff;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 画面シェイク animation */
        .shake {
            animation: shake 0.05s infinite;
        }

        @keyframes shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-8px, 8px) rotate(-2deg); }
            50% { transform: translate(8px, -8px) rotate(2deg); }
            75% { transform: translate(-8px, -8px) rotate(-1deg); }
            100% { transform: translate(8px, 8px) rotate(1deg); }
        }

        /* 画面フラッシュ */
        .flash {
            animation: flash 0.1s alternate 2;
        }
        @keyframes flash {
            from { background-color: var(--bg-color); }
            to { background-color: #ffffff; }
        }

        /* ヘッダー・スコア表示 */
        header {
            width: 100%;
            text-align: center;
            padding: 15px;
            background: linear-gradient(90deg, #ff0055, #7a00ff, #00ffff);
            background-size: 200% 200%;
            animation: rainbowBg 2s infinite linear;
            box-shadow: 0 0 30px #ff0055;
        }

        @keyframes rainbowBg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .score-title {
            font-size: 1.2rem;
            color: #fff;
            text-shadow: 0 0 10px #000;
        }

        .score-display {
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--gold-color);
            text-shadow: 0 0 20px #ff0000, 0 0 40px #ffff00;
        }

        .dps-display {
            font-size: 1.2rem;
            color: var(--sub-color);
        }

        /* メインコンテナ */
        .main-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            width: 95%;
            max-width: 1200px;
            margin-top: 20px;
        }

        .card {
            background: rgba(20, 20, 30, 0.9);
            border: 3px solid #333;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        /* メインクリック領域 */
        .click-section {
            flex: 1 1 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 350px;
        }

        .big-btn {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 8px solid #fff;
            background: radial-gradient(circle, #ff0055 0%, #800020 100%);
            color: #fff;
            font-size: 2.5rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 0 50px #ff0055;
            transition: transform 0.05s;
            outline: none;
        }

        .big-btn:active {
            transform: scale(0.9);
            box-shadow: 0 0 80px #ffff00;
        }

        /* 浮遊テキスト */
        .pop-text {
            position: absolute;
            font-size: 2rem;
            font-weight: bold;
            color: #ffff00;
            pointer-events: none;
            animation: popUp 0.6s ease-out forwards;
            text-shadow: 0 0 10px #ff0000, 2px 2px 0 #000;
            z-index: 99;
        }

        @keyframes popUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100px) scale(2); }
        }

        /* ショップ・ガチャ・FEVER・エンディング一覧 */
        .controls-section {
            flex: 2 1 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* ガチャ＆FEVERエリア */
        .gacha-fever-box {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            flex: 1;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            color: #fff;
            text-shadow: 0 0 5px #000;
            transition: 0.1s;
        }

        .btn-gacha {
            background: linear-gradient(45deg, #00ffff, #0088ff);
            box-shadow: 0 0 15px #00ffff;
        }

        .btn-fever {
            background: linear-gradient(45deg, #ff0000, #ffbb00);
            box-shadow: 0 0 15px #ff0000;
            position: relative;
            overflow: hidden;
        }

        .btn-action:hover {
            transform: scale(1.03);
            filter: brightness(1.2);
        }

        .btn-action:disabled {
            filter: grayscale(1);
            cursor: not-allowed;
        }

        /* 強化ショップ */
        .shop-title {
            font-size: 1.5rem;
            border-bottom: 2px solid var(--sub-color);
            padding-bottom: 5px;
            margin-bottom: 10px;
            color: var(--sub-color);
        }

        .shop-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 250px;
            overflow-y: auto;
        }

        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
        }

        .shop-item button {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }

        .shop-item button:disabled {
            background: #555;
        }

        /* アチーブメント＆エンディングリスト */
        .endings-box {
            margin-top: 10px;
        }

        .ending-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .ending-card {
            background: #111;
            border: 1px dashed #666;
            padding: 8px;
            text-align: center;
            font-size: 0.8rem;
            border-radius: 5px;
        }

        .ending-card.unlocked {
            border: 2px solid var(--gold-color);
            background: #332a00;
            color: var(--gold-color);
            font-weight: bold;
            box-shadow: 0 0 10px var(--gold-color);
        }

        /* モーダル (エンディング画面用) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            padding: 20px;
        }

        .modal-title {
            font-size: 3rem;
            color: var(--gold-color);
            text-shadow: 0 0 30px #ff0000;
            margin-bottom: 20px;
            animation: rainbowBg 1s infinite alternate;
        }

        .modal-desc {
            font-size: 1.5rem;
            margin-bottom: 30px;
            max-width: 600px;
            line-height: 1.4;
        }

        .modal-btn {
            background: #ff0055;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px #ff0055;
        }

        /* ログエリア */
        .log-box {
            width: 95%;
            max-width: 1200px;
            margin: 20px 0;
            background: #000;
            border: 1px solid #333;
            height: 100px;
            overflow-y: auto;
            padding: 10px;
            font-family: monospace;
            font-size: 0.9rem;
            color: #00ff00;
        }

        /* レア演出 */
        .jackpot-overlay {
            position: fixed;
            pointer-events: none;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 500;
            display: none;
            background: radial-gradient(circle, rgba(255,215,0,0.4) 0%, rgba(0,0,0,0) 70%);
        }
    </style>
</head>
<body id="body">

    <div class="jackpot-overlay" id="jackpot"></div>

    <header>
        <div class="score-title">ドーパミン脳汁ポイント (DP)</div>
        <div class="score-display" id="dp-count">0</div>
        <div class="dps-display">毎秒獲得DP (DPS): <span id="dps-count">0</span> | クリック威力: <span id="dpc-count">1</span></div>
    </header>

    <div class="main-container">
        <!-- クリックメイン -->
        <div class="card click-section" id="click-card">
            <button class="big-btn" id="main-click-btn">押せ！！！<br>脳汁爆発！</button>
        </div>

        <!-- コントロール・機能 -->
        <div class="controls-section">
            <div class="gacha-fever-box">
                <button class="btn-action btn-gacha" id="gacha-btn">🧠 脳汁ガチャ<br>(100 DP)</button>
                <button class="btn-action btn-fever" id="fever-btn">🔥 ドーパミンFEVER<br>(ゲージ: <span id="fever-gauge">0</span>%)</button>
            </div>

            <!-- アップグレードショップ -->
            <div class="card">
                <div class="shop-title">⚡ 脳バースト強化ショップ</div>
                <div class="shop-list" id="shop-list"></div>
            </div>

            <!-- 全10種エンディングコレクション -->
            <div class="card endings-box">
                <div class="shop-title">🏆 脳汁分岐エンディング全10種 (<span id="end-count">0</span>/10)</div>
                <div class="ending-grid" id="ending-grid"></div>
            </div>
        </div>
    </div>

    <!-- ログ -->
    <div class="log-box" id="log-box">> ドーパミンシミュレーター起動完了...連打して脳汁を出せ！<br></div>

    <!-- エンディングモーダル -->
    <div class="modal" id="modal">
        <div class="modal-title" id="modal-title">ENDING UNLOCKED!</div>
        <div class="modal-desc" id="modal-desc">説明文</div>
        <button class="modal-btn" onclick="closeModal()">ゲームを継続して次の脳汁へ</button>
    </div>

    <script>
        // 保存キー指定
        const SAVE_KEY_PREFIX = "dopagaki_game/gemini/3.6Flash/001/saves/";
        const SAVE_KEY = SAVE_KEY_PREFIX + "saveData";

        // Web Audio API による音効再現 (サウンドエフェクト)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;
            if (type === 'click') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300 + Math.random() * 400, now);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'fever') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.linearRampToValueAtTime(800, now + 0.3);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'gacha') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.setValueAtTime(1200, now + 0.1);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'ending') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.linearRampToValueAtTime(600, now + 0.5);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                osc.start(now);
                osc.stop(now + 0.6);
            }
        }

        // ゲームステート
        let state = {
            dp: 0,
            totalDp: 0,
            totalClicks: 0,
            feverGauge: 0,
            isFever: false,
            multiplier: 1,
            gachaCount: 0,
            unlockedEndings: [],
            upgrades: {
                clicker: { level: 0, cost: 15, baseDpc: 1, name: "指連打の極意" },
                tiktok: { level: 0, cost: 100, baseDps: 5, name: "倍速ショート動画垂れ流し" },
                gachaAddict: { level: 0, cost: 500, baseDps: 30, name: "重課金ガチャ中毒" },
                brainrot: { level: 0, cost: 3000, baseDps: 200, name: "Brainrotミーム脳内再生" },
                infiniteDopamine: { level: 0, cost: 20000, baseDps: 1500, name: "脳内ドーパミン無限抽出機" }
            }
        };

        // エンディング全10種データ
        const ENDINGS = [
            { id: 1, name: "END 1: ドパガキ覚醒", req: () => state.totalClicks >= 100, desc: "連打100回達成！指先から脳汁が噴出し始めた！" },
            { id: 2, name: "END 2: ガチャ破産", req: () => state.gachaCount >= 10, desc: "ガチャを10回引いた！確率の奴隷へ…！" },
            { id: 3, name: "END 3: 脳汁限界突破 (FEVER)", req: () => state.isFever, desc: "FEVER発動！全身の全細胞が覚醒した！" },
            { id: 4, name: "END 4: ショート動画過剰摂取", req: () => state.upgrades.tiktok.level >= 10, desc: "倍速動画を見すぎて思考速度が光速を超えた！" },
            { id: 5, name: "END 5: DP10万超えの富豪", req: () => state.totalDp >= 100000, desc: "100,000 DP到達！脳汁で世界の通貨を支配！" },
            { id: 6, name: "END 6: ガチャ神光臨", req: () => state.gachaCount >= 50, desc: "ガチャ50回達成！SSRの輝きで目が眩んだ！" },
            { id: 7, name: "END 7: 完全放置マスター", req: () => state.upgrades.infiniteDopamine.level >= 5, desc: "無限抽出機で何もしなくても脳汁が出続ける神の領域！" },
            { id: 8, name: "END 8: 超高速連打マシーン", req: () => state.upgrades.clicker.level >= 25, desc: "クリック威力が破格の域へ！画面が耐えきれない！" },
            { id: 9, name: "END 9: ドーパミンブラックホール", req: () => state.totalDp >= 10000000, desc: "10,000,000 DP突破！脳汁の重力で宇宙が崩壊！" },
            { id: 10, name: "END 10: 究極のドパガキ", req: () => state.unlockedEndings.length >= 9, desc: "全エンディングをほぼコンプ！君こそが真正の【ドパガキ王】だ！！" }
        ];

        // セーブ＆ロード (キー指定順守)
        function saveGame() {
            localStorage.setItem(SAVE_KEY, JSON.stringify(state));
        }

        function loadGame() {
            const saved = localStorage.getItem(SAVE_KEY);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    state = { ...state, ...parsed };
                    // アイテム構造の互換調整
                    for (let key in state.upgrades) {
                        if (parsed.upgrades[key]) {
                            state.upgrades[key].level = parsed.upgrades[key].level;
                            state.upgrades[key].cost = parsed.upgrades[key].cost;
                        }
                    }
                } catch(e) { console.error(e); }
            }
        }

        // DP・DPS・DPCの計算
        function getDpc() {
            let base = 1 + state.upgrades.clicker.level * 3;
            return base * state.multiplier;
        }

        function getDps() {
            let dps = 0;
            dps += state.upgrades.tiktok.level * state.upgrades.tiktok.baseDps;
            dps += state.upgrades.gachaAddict.level * state.upgrades.gachaAddict.baseDps;
            dps += state.upgrades.brainrot.level * state.upgrades.brainrot.baseDps;
            dps += state.upgrades.infiniteDopamine.level * state.upgrades.infiniteDopamine.baseDps;
            return dps * state.multiplier;
        }

        // UI更新
        function updateUI() {
            document.getElementById('dp-count').innerText = Math.floor(state.dp).toLocaleString();
            document.getElementById('dps-count').innerText = Math.floor(getDps()).toLocaleString();
            document.getElementById('dpc-count').innerText = Math.floor(getDpc()).toLocaleString();
            document.getElementById('fever-gauge').innerText = Math.floor(state.feverGauge);

            // ショップリスト更新
            const shopList = document.getElementById('shop-list');
            shopList.innerHTML = '';
            for (let key in state.upgrades) {
                const item = state.upgrades[key];
                const div = document.createElement('div');
                div.className = 'shop-item';
                div.innerHTML = `
                    <div>
                        <strong>${item.name}</strong> (Lv.${item.level})<br>
                        <small>コスト: ${Math.floor(item.cost)} DP</small>
                    </div>
                    <button onclick="buyUpgrade('${key}')" ${state.dp < item.cost ? 'disabled' : ''}>購入</button>
                `;
                shopList.appendChild(div);
            }

            // エンディング一覧更新
            const endingGrid = document.getElementById('ending-grid');
            endingGrid.innerHTML = '';
            ENDINGS.forEach(end => {
                const unlocked = state.unlockedEndings.includes(end.id);
                const div = document.createElement('div');
                div.className = `ending-card ${unlocked ? 'unlocked' : ''}`;
                div.innerText = unlocked ? end.name : `END ${end.id}: ???`;
                endingGrid.appendChild(div);
            });
            document.getElementById('end-count').innerText = state.unlockedEndings.length;
        }

        // ログ表示
        function log(msg) {
            const box = document.getElementById('log-box');
            box.innerHTML += `> ${msg}<br>`;
            box.scrollTop = box.scrollHeight;
        }

        // 浮遊テキスト生成
        function createPopText(x, y, text) {
            const el = document.createElement('div');
            el.className = 'pop-text';
            el.innerText = text;
            el.style.left = `${x - 20}px`;
            el.style.top = `${y - 40}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 600);
        }

        // 画面揺れ・フラッシュ演出
        function triggerEffects() {
            const body = document.getElementById('body');
            body.classList.add('shake');
            setTimeout(() => body.classList.remove('shake'), 80);
        }

        // クリック処理
        document.getElementById('main-click-btn').addEventListener('click', (e) => {
            const gain = getDpc();
            state.dp += gain;
            state.totalDp += gain;
            state.totalClicks++;

            // FEVERゲージ加算
            if (!state.isFever && state.feverGauge < 100) {
                state.feverGauge += 2;
                if (state.feverGauge > 100) state.feverGauge = 100;
            }

            playSound('click');
            createPopText(e.clientX, e.clientY, `+${Math.floor(gain)}!`);
            triggerEffects();
            checkEndings();
            updateUI();
            saveGame();
        });

        // FEVER発動
        document.getElementById('fever-btn').addEventListener('click', () => {
            if (state.feverGauge >= 100 && !state.isFever) {
                state.isFever = true;
                state.multiplier = 10;
                playSound('fever');
                log("🔥【ドーパミンFEVER発動】倍率10倍！脳汁が溢れ出す！！");

                document.getElementById('body').classList.add('flash');
                setTimeout(() => document.getElementById('body').classList.remove('flash'), 200);

                let left = 10;
                const feverInterval = setInterval(() => {
                    left--;
                    state.feverGauge = (left / 10) * 100;
                    if (left <= 0) {
                        clearInterval(feverInterval);
                        state.isFever = false;
                        state.multiplier = 1;
                        state.feverGauge = 0;
                        log("FEVER終了。通常状態へ戻りました。");
                        updateUI();
                    }
                    updateUI();
                }, 1000);
            }
        });

        // ガチャシステム
        document.getElementById('gacha-btn').addEventListener('click', () => {
            const cost = 100;
            if (state.dp >= cost) {
                state.dp -= cost;
                state.gachaCount++;
                playSound('gacha');

                const rand = Math.random();
                if (rand < 0.05) { // 5% SSR
                    const reward = 10000;
                    state.dp += reward;
                    state.totalDp += reward;
                    log(`✨【SSR超激レア！】脳汁ハイパーリワード！ +${reward} DP獲得！`);
                    document.getElementById('jackpot').style.display = 'block';
                    setTimeout(() => document.getElementById('jackpot').style.display = 'none', 1000);
                } else if (rand < 0.3) { // 25% SR
                    const reward = 1000;
                    state.dp += reward;
                    state.totalDp += reward;
                    log(`🌟【SR激レア】大量DPゲット！ +${reward} DP！`);
                } else {
                    const reward = 150;
                    state.dp += reward;
                    state.totalDp += reward;
                    log(`🎉【N】微小な脳汁獲得 +${reward} DP`);
                }

                checkEndings();
                updateUI();
                saveGame();
            }
        });

        // 強化購入
        function buyUpgrade(key) {
            const item = state.upgrades[key];
            if (state.dp >= item.cost) {
                state.dp -= item.cost;
                item.level++;
                item.cost *= 1.5;
                playSound('click');
                log(`${item.name} を強化！(Lv.${item.level})`);
                checkEndings();
                updateUI();
                saveGame();
            }
        }

        // エンディング判定
        function checkEndings() {
            ENDINGS.forEach(end => {
                if (!state.unlockedEndings.includes(end.id) && end.req()) {
                    state.unlockedEndings.push(end.id);
                    showModal(end.name, end.desc);
                    playSound('ending');
                    log(`🏆【エンディング解除】${end.name}`);
                }
            });
        }

        // モーダル表示・非表示
        function showModal(title, desc) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        // ループ（毎秒DPS加算 & 放置収入）
        setInterval(() => {
            const dps = getDps();
            if (dps > 0) {
                const gain = dps / 10;
                state.dp += gain;
                state.totalDp += gain;
                checkEndings();
                updateUI();
            }
        }, 100);

        // 自動セーブ (5秒ごと)
        setInterval(saveGame, 5000);

        // 初期化
        loadGame();
        updateUI();
    </script>
</body>
</html>
